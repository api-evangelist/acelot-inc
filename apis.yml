aid: acelot-inc
name: Acelot, Inc.
description: >-
  Acelot, Inc. is a clinical-stage biopharmaceutical company headquartered in South San Francisco,
  California, developing first-in-class small-molecule therapies for neurodegenerative diseases with
  high unmet need. Its lead candidate, ACE-2223, is designed to target misfolded and aggregated
  TDP-43 and restore the protein's healthy form and function, addressing pathology central to
  amyotrophic lateral sclerosis (ALS) and frontotemporal lobar degeneration (FTLD). Acelot's
  discovery work is powered by Resolute, an internal integrated drug-discovery platform combining
  AI-driven computational chemistry with structural and biological insight to drug historically
  intractable protein targets. Acelot publishes no public API, developer portal, SDK or
  machine-readable specification; its four public GitHub repositories are forks of third-party
  cheminformatics tooling.
